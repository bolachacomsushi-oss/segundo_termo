<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Vídeos</title>
</head>
<body>
    <h1>Trabalhando com Imagens</h1>
    <h2>Imagem responsiva básica</h2>
        <figure class="resp-bas">
            <img src="https://i.pinimg.com/736x/1a/25/d6/1a25d6c006bcdef094552507ef36979a.jpg" alt="Imagem 1">
        </figure>

    <h2>Imagem de recorte</h2>
        <figure class="img-rec">
            <img src="https://i.pinimg.com/736x/21/8e/56/218e56b690283a9b25d0eff5f6b955f2.jpg" alt="Imagem 2">
        </figure>

    <h2>Imagem em formato de cards</h2>
        <figure class="img-card">
            <img src="https://i.pinimg.com/736x/a9/0c/cf/a90ccf64140f3744dd3148ead372b239.jpg" alt="Imagem 3">
        </figure>

    <h2>Personalização</h2>
        <figure class="pers-img">
            <img src="https://i.pinimg.com/736x/ba/c5/bb/bac5bb19b5f3b27758442908fb2a5d94.jpg" alt="Imagem 4">
        </figure>

    <h2>Imagens em Grid</h2>
        <section class="sec-grid">
            <article class="img-grid">
                <img src="https://i.pinimg.com/736x/ac/d0/a1/acd0a1c2320aaa1671184968e2c646e5.jpg" alt="Imagem 5">
            </article>
            <article class="img-grid">
                <img src="https://i.pinimg.com/736x/37/4b/58/374b58d5c1b8dac5375c2943595ead2f.jpg" alt="Imagem 6">
            </article>
            <article class="img-grid">
                <img src="https://i.pinimg.com/736x/d9/e3/06/d9e306381959d0e5967f30e12881ee36.jpg" alt="Imagem 7">
            </article>
        </section>

        <section class="video">
            <h2>Pretty Girl - Shortcake!</h2>
            <iframe class="video-bd" width="560" height="315" src="https://www.youtube.com/embed/yNt9Vr3TXaU?si=QpS3qUy5owzGlOOa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>


</body>
</html>
