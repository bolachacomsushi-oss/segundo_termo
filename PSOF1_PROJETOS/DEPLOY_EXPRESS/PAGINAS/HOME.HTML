<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylehome.css">
    <title>Vintage Patty - O burguer que te faz voltar no tempo</title>
</head>
<body>

    <div class="site">

        <!-- Cabeçalho -->
        <header>
            <a href="#logo" class="logo">Vintage Patty</a>

            <nav>
                <a href="#inicio">início</a>
                <a href="CARDAPIO.HTML">cardápio</a>
                <a href="#promocoes">promoções</a>
                <a href="#login">login</a>
            </nav>
        </header>

        <!-- Banner principal -->
        <section class="banner" id="inicio">
            <button class="seta">&lt;</button>

            <div class="imagem-banner">
                <img src="imagens/banner.jpg" alt="Hambúrguer em destaque">
            </div>

            <button class="seta">&gt;</button>
        </section>

        <!-- Cardápio -->
        <section class="cardapio" id="cardapio">

            <article class="produto">
                <img src="imagens/lanche1.jpg" alt="Hambúrguer artesanal">
                <p>descrição da comida</p>
                <button>compre aqui</button>
            </article>

            <article class="produto">
                <img src="imagens/lanche2.jpg" alt="Hambúrguer com queijo">
                <p>descrição da comida</p>
                <button>compre aqui</button>
            </article>

            <article class="produto">
                <img src="imagens/lanche3.jpg" alt="Hambúrguer com bacon">
                <p>descrição da comida</p>
                <button>compre aqui</button>
            </article>

        </section>

        <!-- Promoções -->
        <section class="promocoes" id="promocoes">
            <h2>Promoções do Dia</h2>

            <div class="lista-promocoes">

                <article class="promocao">
                    <div class="imagem-promocao">
                        <img src="imagens/combo.jpg" alt="Combo de hambúrguer">
                        <button>+</button>
                    </div>
                    <p>imagem de combo</p>
                    <p>R$ ****</p>
                </article>

                <article class="promocao">
                    <div class="imagem-promocao">
                        <img src="imagens/bebida.jpg" alt="Bebida gelada">
                        <button>+</button>
                    </div>
                    <p>imagem de bebida</p>
                    <p>R$ ****</p>
                </article>

                <article class="promocao">
                    <div class="imagem-promocao">
                        <img src="imagens/porcao.jpg" alt="Porção de batatas">
                        <button>+</button>
                    </div>
                    <p>imagem de porção</p>
                    <p>R$ ****</p>
                </article>

            </div>
        </section>

        <!-- Rodapé -->
        <footer>

            <div class="frase">
                <span></span>
                <p>Desde 1997
                matando
                sua fome</p>
            </div>

            <div class="atendimento">
                <div class="titulo-atendimento">
                    <p>Suporte e Atendimento</p>
                    <a href="#contato">fale com a gente</a>
                </div>

                <div class="imagem-atendimento">
                    <img src="imagens/atendimento.jpg" alt="Atendimento da hamburgueria">
                </div>

                <div class="selos">
                    <span>selo</span>
                    <span>selo</span>
                    <span>selo</span>
                </div>
            </div>

        </footer>

    </div>

</body>
</html>
